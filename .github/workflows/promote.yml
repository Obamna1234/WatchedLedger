# "Release it": turns a beta (pre-release) into the normal release, so it
# shows as Latest and AltStore / SideStore offer it. Run only after the owner
# has tried the beta and said "release it".
#
# Refuses unless every check on that exact build passed: CI (tests and both
# builds), "Update keeps the library" and "Device tests".
name: Release it

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.3.0'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  promote:
    # Only the copy of this workflow on main can release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the beta and its checks, then release it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Bad version '$VERSION'"; exit 1
          fi
          tag="v$VERSION"
          rel="$(gh api "repos/$REPO/releases/tags/$tag")"
          if [ "$(jq -r .prerelease <<<"$rel")" != true ]; then
            echo "::error::$tag is not a beta (already released, or missing)."; exit 1
          fi
          sha="$(gh api "repos/$REPO/commits/$tag" --jq .sha)"
          echo "Checking $tag ($sha)" >> "$GITHUB_STEP_SUMMARY"

          # The release must be built from main.
          st="$(gh api "repos/$REPO/compare/$sha...main" --jq .status)"
          if [ "$st" != ahead ] && [ "$st" != identical ]; then
            echo "::error::$tag ($sha) is not on main."; exit 1
          fi

          # Every required check must have run on this commit and passed.
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100")"
          # Matched by workflow file and a push to main, not just by name.
          for wf in ci.yml upgrade-test.yml device-tests.yml; do
            result="$(jq -r --arg p ".github/workflows/$wf" '[.workflow_runs[] | select(.path == $p and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last | "\(.status) \(.conclusion)"' <<<"$runs")"
            echo "- $wf: $result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "completed success" ]; then
              echo "::error::$wf has not passed on $tag ($result)."; exit 1
            fi
          done

          id="$(jq -r .id <<<"$rel")"
          body="$(jq -r .body <<<"$rel" | sed '/^\*\*Beta:\*\*/,+1d')"
          gh api -X PATCH "repos/$REPO/releases/$id" \
            -F prerelease=false -f make_latest=true \
            -f name="WatchedLedger $VERSION" -f body="$body" >/dev/null
          echo "Released $tag." >> "$GITHUB_STEP_SUMMARY"
