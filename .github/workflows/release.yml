# Publishes a GitHub Release with the signed APK and the unsigned IPA.
#
# Automatic: when `version:` in pubspec.yaml changes on main (e.g. 0.1.0 →
# 0.2.0) and no tag vX.Y.Z exists yet, this builds, tags and publishes it.
# Pushing a tag vX.Y.Z by hand also works.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/release.yml'
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Bad version '$version'"; exit 1
          fi
          release=true
          if [ "$REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=false
            echo "v$version is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release: true
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{android-apk,ios-ipa}'
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WatchedLedger ${{ needs.check.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Android:** download the `.apk` below and open it on your phone.
            **iPhone:** download the `.ipa` and install it with SideStore, AltStore or Sideloadly (see the README).

            Verify downloads against `SHA256SUMS.txt`.
