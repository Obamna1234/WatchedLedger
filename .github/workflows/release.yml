# Push a tag like v1.2.0 to publish a GitHub Release with the signed APK and
# the unsigned IPA attached.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{android-apk,ios-ipa}'
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Android:** download the `.apk` below and open it on your phone.
            **iPhone:** download the `.ipa` and install it with SideStore, AltStore or Sideloadly (see the README).

            Verify downloads against `SHA256SUMS.txt`.
