# Publishes a BETA GitHub Release (a pre-release) with the signed APK and the
# unsigned IPA. It becomes the normal release only when the owner says
# "release it" and the "Release it" workflow (promote.yml) runs.
#
# Automatic: when `version:` in pubspec.yaml changes on main (e.g. 1.2.0 →
# 1.3.0) and no tag vX.Y.Z exists yet, this builds, tags and publishes the
# beta. Pushing a tag vX.Y.Z by hand also works.
#
# Gate: docs/reviews/vX.Y.Z.md (the security and privacy review of everything
# changed since the last release) must exist, or nothing is published.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/release.yml'
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Bad version '$version'"; exit 1
          fi
          release=true
          if [ "$REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=false
            echo "v$version is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$release" = true ] && [ ! -f "docs/reviews/v$version.md" ]; then
            echo "::error::No security and privacy review for v$version (docs/reviews/v$version.md). Not publishing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release: true
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{android-apk,ios-ipa}'
          path: dist
          merge-multiple: true

      - name: AltStore / SideStore source
        # A small JSON file that lets AltStore or SideStore offer updates.
        # Always reachable at .../releases/latest/download/altstore-source.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ipa="dist/WatchedLedger-$VERSION.ipa"
          size=$(stat -c %s "$ipa")
          today=$(date -u +%Y-%m-%d)
          python3 - "$VERSION" "$REPO" "$size" "$today" > dist/altstore-source.json <<'PY'
          import json, sys
          version, repo, size, today = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4]
          base = f"https://github.com/{repo}"
          print(json.dumps({
            "name": "WatchedLedger",
            "identifier": "app.watchedledger.source",
            "website": base,
            "apps": [{
              "name": "WatchedLedger",
              "bundleIdentifier": "app.watchedledger",
              "developerName": repo.split("/")[0],
              "subtitle": "Private tracker for what you watch, read and hear",
              "localizedDescription": "Private, offline-first tracker for movies, series, books, audiobooks and podcasts. No accounts, no tracking.",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/assets/icon/icon.png",
              "tintColor": "2EC48A",
              "category": "lifestyle",
              "versions": [{
                "version": version,
                "date": today,
                "localizedDescription": f"See {base}/releases/tag/v{version}",
                "downloadURL": f"{base}/releases/download/v{version}/WatchedLedger-{version}.ipa",
                "size": size,
                "minOSVersion": "15.0",
              }],
              "appPermissions": {
                "entitlements": [],
                "privacy": {
                  "NSFaceIDUsageDescription": "Unlock WatchedLedger with Face ID if you turn on the app lock."
                },
              },
            }],
            "news": [],
          }, indent=2))
          PY
          cat dist/altstore-source.json

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WatchedLedger ${{ needs.check.outputs.version }} (beta)
          prerelease: true
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Beta:** try it on your own phone first. It becomes the normal release after you say "release it".

            **Android:** download the `.apk` below and open it on your phone.
            **iPhone:** download the `.ipa` and install it with SideStore, AltStore or Sideloadly (see the README). In AltStore/SideStore you can add this source once to get updates: `https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json`

            Verify downloads against `SHA256SUMS.txt`.
